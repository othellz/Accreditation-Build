# Production: the app behind Caddy, which gets and renews HTTPS certificates automatically.
# Usage: set DOMAIN in .env (e.g. DOMAIN=accreditation.example.com), then `docker compose up -d --build`.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SECURE_COOKIES: "1"
      SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN in .env}
      EVENT_TZ: ${EVENT_TZ:-Africa/Lagos}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - app_data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_data:
  caddy_data:
  caddy_config:
